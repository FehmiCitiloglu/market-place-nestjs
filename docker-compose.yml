# Mercato local development infrastructure.
#
# Images are pinned to exact versions/digests verified to exist at time of
# writing (2026-10-21):
#   postgres:18.6-alpine          (PostgreSQL 18 is the current stable major)
#   redis:8.8.3-alpine
#   cgr.dev/chainguard/minio@sha256:ad134b2d...  (MinIO built from source by
#     Chainguard; runs as non-root. MinIO Community Edition images were removed
#     from Docker Hub/Quay in 2026 — see docs/adr/013-local-object-storage.md)
#   axllent/mailpit:v1.31.6       (local SMTP capture)
#
# This stack is for local development and CI only.

name: mercato

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${MERCATO_POSTGRES_USER:-mercato}
      POSTGRES_PASSWORD: ${MERCATO_POSTGRES_PASSWORD:-mercato-dev-only}
      POSTGRES_DB: ${MERCATO_POSTGRES_DB:-mercato}
    ports:
      - '${MERCATO_POSTGRES_PORT:-55432}:5432'
    volumes:
      # PostgreSQL 18+ images manage a version-specific data directory under
      # /var/lib/postgresql (see docker-library/postgres#1259).
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    # Development-only credentials. Never run this configuration in production:
    # the runtime role must not own migration privileges
    # (see docs/operations/database-migrations.md).
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${MERCATO_REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # S3-compatible object storage for local development (MinIO server).
  storage:
    image: cgr.dev/chainguard/minio:latest@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    environment:
      MINIO_ROOT_USER: ${MERCATO_S3_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MERCATO_S3_ROOT_PASSWORD:-minioadmin-dev-only}
    ports:
      - '${MERCATO_S3_PORT:-9000}:9000'
      - '${MERCATO_S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage-data:/data
    command: ['server', '/data', '--console-address', ':9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot bucket provisioning (idempotent: `mc mb -p` is a no-op if the
  # bucket exists).
  storage-init:
    image: cgr.dev/chainguard/minio:latest@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    environment:
      MINIO_ROOT_USER: ${MERCATO_S3_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MERCATO_S3_ROOT_PASSWORD:-minioadmin-dev-only}
    command:
      - >-
        mc alias set local http://storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb -p "local/$${MERCATO_S3_BUCKET_PUBLIC:-mercato-public}" &&
        mc mb -p "local/$${MERCATO_S3_BUCKET_PRIVATE:-mercato-private}"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '${MERCATO_MAIL_SMTP_PORT:-1025}:1025'
      - '${MERCATO_MAIL_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
