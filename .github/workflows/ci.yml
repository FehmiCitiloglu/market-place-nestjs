name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: |
          pnpm -r --workspace-concurrency=1 --filter '!@mercato/api' test
          pnpm --filter @mercato/api test:unit

      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis storage storage-init mailpit

      - name: Integration tests
        run: pnpm --filter @mercato/api test:integration

      - name: OpenAPI contract validation
        run: pnpm --filter @mercato/contracts validate:openapi

      - name: Migration verification (generate + apply)
        env:
          DATABASE_URL: postgres://mercato:mercato-dev-only@127.0.0.1:55432/mercato_test
        run: |
          pnpm --filter @mercato/api db:generate
          git diff --exit-code -- apps/api/src/db/migrations || (echo "Migrations are not up to date with the schema" && exit 1)
          pnpm --filter @mercato/api db:migrate

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static security analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep ci --config auto --error --quiet
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  dependency-scan:
    name: Dependency vulnerability scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install osv-scanner
        run: |
          curl -sfL https://github.com/google/osv-scanner/releases/download/v2.3.0/osv-scanner_2.3.0_linux_amd64.deb -o osv-scanner.deb
          sudo dpkg -i osv-scanner.deb
      - name: Scan lockfile
        run: osv-scanner scan --recursive --lockfile=pnpm-lock.yaml
      - name: npm audit (production dependencies)
        run: pnpm audit --prod --audit-level high

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The application Dockerfile lands with Phase 8 containerization; until
    # then this job is skipped instead of pretending to scan an image.
    if: hashFiles('infra/docker/Dockerfile.api') != ''
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f infra/docker/Dockerfile.api -t mercato-api:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: mercato-api:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
